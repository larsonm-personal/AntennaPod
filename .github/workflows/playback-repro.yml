name: Stream change reproduction

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playback:
    name: Passage after rewind (API 30, debug)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: playback-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
      - name: Generate the two episode editions
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          python3 app/src/androidTest/fixtures/dynamic-ads/generate.py app/build/generated/playbackFixtures/dynamic-ads
      - name: Check the result reporter
        run: python3 -m unittest discover -s .github/workflows -p testPlaybackRepro.py
      - name: Build debug application and tests
        run: ./gradlew :app:assembleDebug :app:assemblePlayDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rewind with unchanged and changed streams (three runs, no retries)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          channel: canary
          emulator-options: -accel on -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: python3 .github/workflows/runPlaybackRepro.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: playback-repro
          path: app/build/playback-repro/
