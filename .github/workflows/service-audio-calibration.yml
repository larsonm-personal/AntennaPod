name: Service audio calibration

on:
  pull_request:
    branches: [playback-test-expansion]
    types: [opened, synchronize, reopened]

jobs:
  calibration:
    name: Service audio API 30 ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Fixture tools and runner controls
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 ffmpeg
          ffmpeg -hide_banner -encoders | grep libmp3lame
          bash -n .github/workflows/runServiceAudioCalibration.sh .github/workflows/testServiceAudioCalibration.sh
          bash .github/workflows/testServiceAudioCalibration.sh
      - name: Temporary release keystore
        if: matrix.variant == 'release'
        run: keytool -genkeypair -dname "cn=AntennaPod CI, o=AntennaPod, c=DE" -alias alias -keystore app/keystore -storepass password -keypass password -keyalg RSA -keysize 2048 -validity 10000
      - name: Build calibration APKs
        run: |
          variant="${{ matrix.variant }}"
          ./gradlew :app:assemblePlay${variant^} :app:assemblePlay${variant^}AndroidTest -PtestBuildType="$variant"
          sha256sum app/build/outputs/apk/play/$variant/*.apk app/build/outputs/apk/androidTest/play/$variant/*.apk
          ./gradlew --stop
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Three fixed repetitions
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          channel: canary
          emulator-options: -accel on -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/play/${{ matrix.variant }}/app-play-${{ matrix.variant }}.apk
            adb install app/build/outputs/apk/androidTest/play/${{ matrix.variant }}/app-play-${{ matrix.variant }}-androidTest.apk
            bash .github/workflows/runServiceAudioCalibration.sh ${{ matrix.variant }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: service-audio-${{ matrix.variant }}
          path: app/build/service-audio-calibration/
